<!DOCTYPE html>
<html>
    <head>
        <title>My Calculator</title>
        <meta charset="UTF-8">
        <meta name="viewport" width="device-width" initial-scale=1.0>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="calculator">
            <h1>Calculator</h1>
            <div id="display">0</div>
            <div class="btnNumber">
                <button>0</button>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>7</button>
                <button>8</button>
                <button>9</button>
            </div>
            <div class="btnSingual">
                <button>+</button>
                <button>-</button>
                <button>*</button>
                <button>/</button>
            </div>
            <button id="btnReasult">=</button>
            <button id="btnClear">C</button>
        
        </div>
        <script src="script.js"></script>
        
    </body>
</html>
